name: backend-test

on:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test
        working-directory: apps/backend
        run: make test
